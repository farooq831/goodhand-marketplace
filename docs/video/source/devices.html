<!doctype html>
<html><head><meta charset="utf-8"><title>devices</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: Inter, sans-serif; background: radial-gradient(circle at 80% 15%, rgba(232,163,61,.2), transparent 40%), linear-gradient(125deg, #102622, #18332F 45%, #0F6E5F); display: flex; align-items: center; justify-content: center; gap: 46px; }
  .phone { width: 296px; height: 626px; border-radius: 42px; background: #0b1412; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.08); opacity: 0; transform: translateY(40px); animation: up .9s ease-out forwards; position: relative; }
  .phone:nth-child(2) { animation-delay: .5s; transform: translateY(40px) scale(1.04); } .phone:nth-child(3) { animation-delay: 1s; }
  .screen { width: 272px; height: 602px; border-radius: 32px; overflow: hidden; background: #fff; }
  iframe { width: 390px; height: 863px; border: 0; transform: scale(.6975); transform-origin: 0 0; }
  .tag { position: absolute; bottom: -38px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.85); font-weight: 700; font-size: 16px; letter-spacing: .12em; text-transform: uppercase; }
  @keyframes up { to { opacity: 1; transform: none; } }
</style></head>
<body>
  <div class="phone"><div class="screen"><iframe id="f1" src="http://localhost:5173/"></iframe></div><div class="tag">Light</div></div>
  <div class="phone"><div class="screen"><iframe id="f2" src="about:blank"></iframe></div><div class="tag">Dark</div></div>
  <div class="phone"><div class="screen"><iframe id="f3" src="about:blank"></iframe></div><div class="tag">Any screen</div></div>
</body></html>
